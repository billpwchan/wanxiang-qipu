<!doctype html>
<!-- README 数据图：同一套路线的两种算法（打成这套的对局 vs 专门打这套的棋手的全部对局）。
     数据直接读 site/dist/data/facts.js，数据更新后重跑 scripts/build_readme_images.mjs chart。?theme=dark 为夜场版。
     配色经 dataviz 校验：浅色 #2c46f5/#d8952a（表面 #f6f8fd），夜场 #6a78f5/#c98500（表面 #0f1528）。 -->
<html lang="zh-CN">
<meta charset="utf-8">
<title>两种算法</title>
<style>
:root { --surface: #f6f8fd; --ink: #10152e; --ink2: #465073; --ink3: #7a82a3; --grid: #e2e7f2; --axis: #c9d0e2; --itt: #2c46f5; --done: #d8952a; --link: rgba(16,21,46,.16); }
:root.dark { --surface: #0f1528; --ink: #ecf0ff; --ink2: #aab3d3; --ink3: #7c86ab; --grid: #1c2440; --axis: #2a3354; --itt: #6a78f5; --done: #c98500; --link: rgba(236,240,255,.18); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; background: var(--surface); }
body { padding: 52px 56px 44px; font: 16px/1.55 system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.eyebrow { font-size: 15px; font-weight: 600; letter-spacing: .08em; color: var(--ink3); }
h1 { font-size: 34px; line-height: 1.25; font-weight: 700; margin: 8px 0 10px; letter-spacing: .01em; }
.sub { font-size: 17px; color: var(--ink2); }
.legend { display: flex; gap: 28px; margin: 26px 0 6px; font-size: 15px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 9px; }
.legend i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
svg { display: block; overflow: visible; font-variant-numeric: tabular-nums; }
.foot { margin-top: 22px; font-size: 13px; line-height: 1.7; color: var(--ink3); max-width: 1060px; }
</style>
<p class="eyebrow">同一套路线，两种算法</p>
<h1>只算打成的对局，每套路线都显得很强</h1>
<p class="sub" id="sub"></p>
<div class="legend"><span><i style="background:var(--done)"></i>打成这套的对局（没打成的人被算进了别的阵容）</span><span><i style="background:var(--itt)"></i>专门打这套的棋手，开局选了就算的全部对局</span></div>
<svg id="c"></svg>
<p class="foot" id="foot"></p>
<script type="module">
import { FACTS } from '/data/facts.js';
import { ROUTES } from '/data/plan.js';
const dark = new URLSearchParams(location.search).get('theme') === 'dark';
document.documentElement.classList.toggle('dark', dark);

const rows = ROUTES.map((r) => ({ r, s: FACTS.routes[r.id].stat, d: FACTS.routes[r.id].done })).filter((x) => x.d).sort((a, b) => a.s.avg - b.s.avg);
const byDone = [...rows].sort((a, b) => a.d.avg - b.d.avg);
rows.forEach((x, i) => { x.rankItt = i + 1; x.rankDone = byDone.indexOf(x) + 1; });
const flip = [...rows].sort((a, b) => (b.rankItt - b.rankDone) - (a.rankItt - a.rankDone))[0];
const lo = Math.min(...rows.map((x) => x.s.avg)), hi = Math.max(...rows.map((x) => x.s.avg));
const dlo = Math.min(...rows.map((x) => x.d.avg)), dhi = Math.max(...rows.map((x) => x.d.avg));
document.getElementById('sub').textContent = `6 人一局，名次越小越好，3.5 是平均。只看打成的对局，十套路线分布在 ${dlo.toFixed(1)}–${dhi.toFixed(1)} 名；按开局选择算，全部挤进 ${lo.toFixed(1)}–${hi.toFixed(1)}，排名也换了。`;

const W = 1088, LABEL = 206, X0 = 1.5, X1 = 4.0, PW = 600, ROW = 50, TOP = 34;
const H = TOP + rows.length * ROW + 34;
const x = (v) => LABEL + ((v - X0) / (X1 - X0)) * PW;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let g = '';
for (let v = X0; v <= X1 + 1e-9; v += 0.5) {
  const avg = Math.abs(v - 3.5) < 1e-9;
  g += `<line x1="${x(v)}" x2="${x(v)}" y1="${TOP - 10}" y2="${H - 30}" stroke="${avg ? 'var(--axis)' : 'var(--grid)'}" stroke-width="1"/>`;
  g += `<text x="${x(v)}" y="${H - 8}" text-anchor="middle" font-size="13" fill="var(--ink3)">${avg ? '3.5 平均' : v.toFixed(1)}</text>`;
}
g += `<text x="${x(X0)}" y="${TOP - 18}" font-size="13" fill="var(--ink3)">← 名次更好</text>`;
rows.forEach((row, i) => {
  const cy = TOP + i * ROW + ROW / 2;
  const a = x(row.d.avg), b = x(row.s.avg);
  g += `<text x="0" y="${cy - 3}" font-size="17" font-weight="600" fill="var(--ink)">${esc(row.r.name)}</text>`;
  g += `<text x="0" y="${cy + 16}" font-size="13" fill="var(--ink3)">${esc(row.s.lord)} · ${Math.round(row.s.share * 100)}% 的对局打这套</text>`;
  g += `<line x1="${a}" x2="${b}" y1="${cy}" y2="${cy}" stroke="var(--link)" stroke-width="3" stroke-linecap="round"/>`;
  for (const [cx, col] of [[a, 'var(--done)'], [b, 'var(--itt)']]) g += `<circle cx="${cx}" cy="${cy}" r="8" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
  g += `<text x="${a - 15}" y="${cy + 5}" text-anchor="end" font-size="14" fill="var(--ink3)">${row.d.avg.toFixed(2)}</text>`;
  g += `<text x="${b + 15}" y="${cy + 5}" font-size="14" font-weight="600" fill="var(--ink)">${row.s.avg.toFixed(2)}</text>`;
  if (row === flip) g += `<text x="${b + 62}" y="${cy + 5}" font-size="14" fill="var(--ink2)">打成时排第 ${row.rankDone} → 按开局选择排第 ${row.rankItt}</text>`;
});
const svg = document.getElementById('c');
svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
svg.innerHTML = g;

const combo = rows.filter((x) => !x.d.label.startsWith('打成这套')).map((x) => `${x.r.name}的金点是「${x.d.label.replace(/的对局$/, '')}」`).join('；');
document.getElementById('foot').textContent = `数据：${FACTS.source}。蓝点：路线推荐棋手里终局打这套比例最高的那位，开局选了这个棋手之后的全部对局。${combo}。冷门棋手（孙小宾、班叔、玉环、庄小鱼）的玩家可能多是专门练这套的人，数字偏好。`;
await document.fonts.ready;
document.body.dataset.ready = '1';
</script>
</html>
